<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zalik</title>


    <style>
        .grid{
            display: grid;
            grid-template-rows: 100vh;
            grid-template-columns: 60vw 20vw 20vw;
            grid-template-areas: 
            "block1 block2 block3";    
            margin-right: 0;
            margin-left: 0;  
            margin-top: 0;  
        }

        .grid>div{
            border-width: 1px;
            border-color: aliceblue;
            border-style: solid;
            color:aliceblue;
            font-size: 34pt;
            text-align: center;
            padding-top: 50vh;
            font-weight: bolder;
        }

        #block1{
            grid-area: block1;
            background-color: blue;
            
        }

        #block2{
            grid-area: block2;
            background-color: yellow;
            
        }

        #block3{
            grid-area: block3;
            background-color: red;
            
        }

        @media (max-width: 768px) {
        .grid {
            grid-template-rows: 60vh 20vh 20vh;
        grid-template-columns: 1fr;
        grid-template-areas:
        "block1"
        "block2"
        "block3";
        margin: 0;
    }
  }

    </style>


</head>
<body>
    
    <div class="grid">
        <div id="block1">#1</div>
        <div id="block2">#2</div>
        <div id="block3">#3</div>
    </div>



</body>
</html>
