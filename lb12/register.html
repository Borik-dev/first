<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Реєстрація користувача</title>
    
    <style>
        body {
            background-color: #f4f4f4; /* Світле тло */
            min-height: 100vh;
            display: flex;
            flex-direction: column; /* Основний потік: шапка, контент, підвал */
        }

        /* ----------------------------------
         * 1. ШАПКА (HEADER)
         * ---------------------------------- */
        header {
            background-color: #5d9cec; /* Синій колір, схожий на макет */
            color: white;
            padding: 15px 30px;
            border-bottom: 3px solid #eb4d55; /* Червона лінія */
        }
        
        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .logo-area h1 {
            font-size: 1.5em;
            margin-bottom: 5px;
        }

        .logo-area p {
            font-size: 0.9em;
            opacity: 0.8;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            margin-left: 15px;
            font-size: 1em;
        }
        
        .nav-links a:hover {
            text-decoration: underline;
        }

        /* ----------------------------------
         * 2. ОСНОВНИЙ КОНТЕНТ (ФОРМА)
         * ---------------------------------- */
        .main-content {
            flex-grow: 1; /* Дозволяє контенту зайняти весь доступний простір */
            display: flex;
            justify-content: center; /* Центруємо форму горизонтально */
            padding: 50px 20px;
        }

        .registration-card {
            width: 100%;
            max-width: 400px; /* Обмежуємо ширину форми */
            background: white;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.05);
        }

        .card-header {
            background-color: #5d9cec; 
            color: white;
            padding: 15px;
            text-align: center;
            font-weight: bold;
            border-top-left-radius: 5px;
            border-top-right-radius: 5px;
        }

        .card-body {
            padding: 20px;
        }

        /* Стилі для елементів форми */
        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9em;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        
        .form-group select {
            appearance: none; /* Приховуємо стандартну стрілку */
            background-color: white;
        }

        /* Кнопка */
        .btn-submit {
            display: block;
            width: 100%;
            padding: 10px;
            background-color: #5d9cec;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1em;
            margin-top: 20px;
        }
        
        .btn-submit:hover {
            background-color: #4a8ad8;
        }


        /* ----------------------------------
         * 3. ПІДВАЛ (FOOTER)
         * ---------------------------------- */
        footer {
            background-color: #333;
            color: white;
            padding: 15px 0;
            text-align: center;
            font-size: 0.8em;
        }

        footer p {
            margin: 5px 0;
        }

    </style>
</head>
<body>

    <header>
        <div class="header-content">
            <div class="logo-area">
                <h1>Мій особистий блог</h1>
                <p>Владислав Бублик</p>
            </div>
            <nav class="nav-links">
                <a href="#">Вхід</a>
                <a href="#">Реєстрація</a>
            </nav>
        </div>
    </header>

    <div class="main-content">
        <div class="registration-card">
            
            <div class="card-header">
                Реєстрація користувача
            </div>

            <div class="card-body">
                <form action="#" method="POST">
                    
                    <div class="form-group">
                        <label for="lastname">Прізвище</label>
                        <input type="text" id="lastname" name="lastname" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="firstname">Ім'я</label>
                        <input type="text" id="firstname" name="firstname" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="login">Логін</label>
                        <input type="text" id="login" name="login" required>
                    </div>

                    <div class="form-group">
                        <label for="group">Навчальна група</label>
                        <select id="group" name="group" required>
                            <option value="281" selected>281</option>
                            <option value="282">282</option>
                            <option value="283">283</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="password">Пароль</label>
                        <input type="password" id="password" name="password" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="confirm_password">Підтвердження паролю</label>
                        <input type="password" id="confirm_password" name="confirm_password" required>
                    </div>

                    <button type="submit" class="btn-submit">Зареєструватись</button>
                    
                </form>
            </div>

        </div>
    </div>

    <footer>
        <p>© Всі права захищені.</p>
    </footer>

</body>
</html>
