<html lang="ua">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Завдання 3 — grid</title>


    <style>
        .grid{
            display: grid;
            grid-template-rows: 1fr;
            grid-template-columns: 40vw 20vw 20vw 20vw;
            gap: 3px;
            grid-template-areas: 
            "blue blue blue grey"
            "aqua pink yellow grey"
            "green green yellow grey"
            "brown brown brown brown";  
            margin-top: 5%;
            
        }

        .grid>div{
            border-width: 1px;
            border-color: aliceblue;
            border-style: solid;
            
        }
        
        #blueBlock{
            grid-area: blue;
            background-color: blue;
        }
        #greyBlock{
            grid-area: grey;
            background-color: grey;
        }
        #aquaBlock{
            grid-area: aqua;
            background-color: aqua;
        }
        #pinkBlock{
            grid-area: pink;
            background-color: pink;
        }
        #yellowBlock{
            grid-area: yellow;
            background-color: yellow;
        }
        #greenBlock{
            grid-area: green;
            background-color: green;
        }
        #brownBlock{
            grid-area: brown;
            background-color: brown;
        }
        

  @media (min-width: 500px) {
    .grid {
      grid-template-columns: 1fr 1fr;
      grid-template-areas:
        "blue grey"
        "aqua pink"
        "yellow yellow"
        "green green"
        "brown brown";
      grid-auto-rows: 150px;
      margin: 0;
    }
  }


  @media (min-width: 750px) {
    .grid {
      grid-template-columns: 1fr 1fr 1fr;
      grid-template-areas:
        "blue blue grey"
        "aqua pink yellow"
        "green green yellow"
        "brown brown brown";
      grid-auto-rows: 180px;
    }
  }

  @media (min-width: 950px) {
    .grid {
      grid-template-columns: 1.2fr 1fr 1.2fr 0.8fr; 

      grid-template-columns: 20% 20% 40% 20%;
      grid-template-areas:
        "blue  blue  blue  grey"
        "aqua  pink  yellow grey"
        "green green yellow grey"
        "brown brown brown  brown";
      grid-auto-rows: 180px;
    }
  }

  @media (min-width: 1200px) {
    .grid {
      grid-template-columns: 20% 20% 40% 20%;
      grid-template-areas:
        "blue blue blue grey"
        "aqua pink yellow grey"
        "green green yellow grey"
        "brown brown brown brown";
      grid-auto-rows: minmax(120px, 1fr);
      height: calc(100vh - 0px);
    }
  }


    </style>



</head>
<body>
    
    <div class="grid">
        <div id="blueBlock"></div> <div id="greyBlock"></div>
        <div id="aquaBlock"></div> <div id="pinkBlock"></div> <div id="yellowBlock"></div>
        <div id="greenBlock"></div>
        <div id="brownBlock"></div>
    </div>
    <th>
      <tr>
        <tr>
          
        </tr>
      </tr>
    </th>

</body>
</html>
